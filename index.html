<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KyungHoon Cho</title>
  <meta name="description" content="KyungHoon Cho — Department of Electronic Engineering, KNUT.">

  <!-- Inter font for clean, modern, crisp typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --text-muted: #555555;
      --text-sub: #777777;
      --border: #e5e5e5;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    a {
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    a:hover {
      opacity: 0.6;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 5rem 2.5rem 4rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* ═══════════════════════════════════════════════
       Profile Section (Square photo + Name)
    ═══════════════════════════════════════════════ */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 2.75rem;
    }

    .photo-slot {
      width: 130px;
      height: 130px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background-color: #fafafa;
      flex-shrink: 0;
      overflow: hidden;
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name-heading {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
    }

    /* ═══════════════════════════════════════════════
       Details (Affiliation & Research Interests)
    ═══════════════════════════════════════════════ */
    .details {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      margin-bottom: 3.5rem;
    }

    .item-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-sub);
    }

    .value {
      font-size: 1.15rem;
      color: var(--text);
      font-weight: 400;
    }

    .interest-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .interest-list li {
      font-size: 1.12rem;
      color: var(--text);
      position: relative;
      padding-left: 1.1rem;
    }

    .interest-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* ═══════════════════════════════════════════════
       Links Section (Clean & All in one place)
    ═══════════════════════════════════════════════ */
    .links-section {
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .nav-links a, .nav-links span {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
    }

    .nav-links a {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: #d1d1d1;
    }

    .nav-links a:hover {
      text-decoration-color: var(--text);
    }

    /* ═══════════════════════════════════════════════
       Responsive
    ═══════════════════════════════════════════════ */
    @media (max-width: 640px) {
      .container {
        padding: 3rem 1.5rem;
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .photo-slot {
        width: 110px;
        height: 110px;
      }

      .name-heading {
        font-size: 1.85rem;
      }

      .value, .interest-list li {
        font-size: 1.02rem;
      }

      .nav-links {
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Profile: Square photo + Name only -->
    <header class="profile-header">
      <div class="photo-slot">
        <img src="https://media.licdn.com/dms/image/v2/D5603AQF8vDjCpEBzyA/profile-displayphoto-scale_200_200/B56Z7LG48vJAAg-/0/1781524044613?e=1790208000&v=beta&t=aR2qe3txKjms5qHgxbGnNFHSyWnWTgaYm3IArMap93Y" alt="KyungHoon Cho">
      </div>
      <h1 class="name-heading">KyungHoon Cho</h1>
    </header>

    <!-- Affiliation & Interests -->
    <main class="details">
      <div class="item-group">
        <span class="label">Affiliation</span>
        <div class="value">Department of Electronic Engineering, KNUT</div>
      </div>

      <div class="item-group">
        <span class="label">Research Interests</span>
        <ul class="interest-list">
          <li>Modular Universal Scalable Ion Trap Quantum Computing</li>
          <li>Optical Cavity-QED</li>
        </ul>
      </div>
    </main>

    <!-- Unified Links Section -->
    <footer class="links-section">
      <span class="label">Connect</span>
      <div class="nav-links">
        <a href="https://9uan1um.notion.site/QC-316a11629f2b80de9ca1f3233eff7583" target="_blank" rel="noopener noreferrer">Blog</a>
        <a href="https://www.linkedin.com/in/kyunghoon-cho-5b8a64291?utm_source=share_via&amp;utm_content=profile&amp;utm_medium=member_ios" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="mailto:9uan1um@gmail.com">9uan1um@gmail.com</a>
      </div>
    </footer>

  </div>

</body>
</html>
